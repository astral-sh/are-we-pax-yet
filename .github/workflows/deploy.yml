name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          python-version: '3.14'
          cache-dependency-glob: |
            uv.lock
            generate.py.lock

      - name: Check script lockfile
        run: uv lock --check --script generate.py

      - name: Lint and check formatting
        run: |
          uv run --locked ruff check
          uv run --locked ruff format --check

      - name: Test archive detection
        run: uv run --locked python -m unittest

      - name: Restore sdist format cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sdist-formats-v1.sqlite
          key: sdist-formats-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sdist-formats-v1-

      - name: Build site
        if: github.ref == 'refs/heads/main'
        run: uv run --locked --script generate.py

      - name: Save sdist format cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('.sdist-formats-v1.sqlite') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sdist-formats-v1.sqlite
          key: sdist-formats-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
